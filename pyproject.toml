[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-taste-64"
version = "0.1.0"
description = "Bounded N64 experiments and native-output evidence"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = ["abucache"]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "jsonschema==4.26.0"]  # jsonschema: tests/test_oracle_inputs.py checks the oracle facts against their schema
oracle = ["unbake"]  # the decomp build toolchain ci/oracle calls from the private venv

[project.scripts]
taste = "cake_taste.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cake_taste", "cake_taste.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.setuptools.package-data]
"cake_taste.catalog" = ["page.html"]
"cake_taste.logs" = ["event.schema.json"]

[tool.bootstrap.sources]
abucache = "https://github.com/AbuN64/cache-64@9b5199f3eef804ff2cb085d240e846e2f10850ee"
unbake = "https://github.com/AbuN64/cake-unbake-64@089e157d1651de494f6f8e4a6c1fdb5b4846c894"  # newest commit whose generated Makefile carries the PINS RageWars Makefile generator stamp (882f9732dfb4); keep_dates.py takes 2 arguments
